<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bite Me Buddy - Password Reset</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>Forgot Password</h1>
    <p>Enter your registered phone number</p>

    <input type="text" id="phoneInput" placeholder="10-digit phone number">
    <button id="sendOtpBtn">Send OTP</button>
    <div id="recaptcha-container"></div>
    <div id="response" style="color:red; margin-top:10px;"></div>
</div>

<script>
let firebaseConfig = null;
fetch('/api/firebase-config')
.then(res=>res.json())
.then(config=>{
    firebaseConfig = config;
    firebase.initializeApp(firebaseConfig);
});

document.getElementById('sendOtpBtn').addEventListener('click', ()=>{
    const phone = document.getElementById('phoneInput').value.trim();
    if(!phone || phone.length!==10){ showResponse('Enter valid 10-digit phone'); return; }

    fetch('/api/start-reset',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({phone})
    }).then(res=>res.json())
    .then(data=>{
        if(!data.success){ showResponse(data.message); return; }

        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size':'invisible' });

        firebase.auth().signInWithPhoneNumber('+91'+phone, window.recaptchaVerifier)
        .then(result=>{
            window.localStorage.setItem('confirmationResult', JSON.stringify(result));
            window.sessionStorage.setItem('resetPhone', phone);
            showResponse('OTP sent! Redirecting...', 'green');
            setTimeout(()=>window.location.href='/verify-otp',1500);
        }).catch(err=>showResponse('Failed to send OTP'));
    });
});

function showResponse(msg,color='red'){ 
    const div = document.getElementById('response'); 
    div.style.color=color; 
    div.innerText=msg;
}
</script>
</body>
</html>
