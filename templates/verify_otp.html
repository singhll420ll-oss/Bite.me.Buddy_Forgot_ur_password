<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP - Bite Me Buddy</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
  <h1>Bite Me Buddy - Firebase OTP</h1>
  <p>Enter your phone number to receive OTP:</p>
  <input type="text" id="phoneNumber" placeholder="+91xxxxxxxxxx">
  <div id="recaptcha-container"></div>
  <button onclick="sendOTP()">Send OTP</button>

  <div id="otpDiv" style="display:none;">
    <p>Enter OTP:</p>
    <input type="text" id="otpInput" placeholder="6-digit OTP">
    <button onclick="verifyOTP()">Verify OTP</button>
  </div>

  <div id="response"></div>
</div>

<script>
  // Firebase config from backend
  fetch('/api/firebase-config')
    .then(res => res.json())
    .then(config => {
      firebase.initializeApp(config);
      window.auth = firebase.auth();
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'normal',
        'callback': (response) => { console.log('reCAPTCHA solved'); },
        'expired-callback': () => { console.log('reCAPTCHA expired'); }
      });
      recaptchaVerifier.render();
    });

  let confirmationResult;

  function sendOTP() {
    const phoneNumber = document.getElementById('phoneNumber').value;
    auth.signInWithPhoneNumber(phoneNumber, recaptchaVerifier)
      .then(result => {
        confirmationResult = result;
        document.getElementById('otpDiv').style.display = 'block';
        showResponse('OTP sent! Check your phone.', 'success');
      })
      .catch(error => {
        showResponse(error.message, 'error');
      });
  }

  function verifyOTP() {
    const code = document.getElementById('otpInput').value;
    confirmationResult.confirm(code)
      .then(result => {
        result.user.getIdToken().then(idToken => {
          fetch('/api/firebase-verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idToken })
          })
          .then(res => res.json())
          .then(data => {
            if(data.success) {
              showResponse('OTP verified! Redirecting...', 'success');
              window.location.href = '/reset-password';
            } else {
              showResponse(data.message, 'error');
            }
          });
        });
      })
      .catch(error => {
        showResponse('Invalid OTP', 'error');
      });
  }

  function showResponse(msg, type) {
    const div = document.getElementById('response');
    div.innerHTML = `<p class="${type}">${msg}</p>`;
  }
</script>
</body>
</html>
