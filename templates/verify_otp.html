<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>Enter OTP</h1>
    <p>OTP sent to your phone</p>

    <div class="otp-inputs">
        <input type="text" id="digit1" maxlength="1">
        <input type="text" id="digit2" maxlength="1">
        <input type="text" id="digit3" maxlength="1">
        <input type="text" id="digit4" maxlength="1">
        <input type="text" id="digit5" maxlength="1">
        <input type="text" id="digit6" maxlength="1">
    </div>

    <button id="verifyBtn">Verify OTP</button>
    <button id="resendBtn" disabled>Resend OTP (<span id="resendTimer">60</span>s)</button>
    <div id="response" style="color:red; margin-top:10px;"></div>
    <div id="recaptcha-container"></div>
</div>

<script>
let firebaseConfig=null,totalSeconds=60,resendInterval;
fetch('/api/firebase-config').then(res=>res.json()).then(config=>{
    firebaseConfig=config; firebase.initializeApp(firebaseConfig);
});

const otpInputs=[...document.querySelectorAll('.otp-inputs input')];
otpInputs.forEach((input,i)=>{
    input.addEventListener('input',()=>{if(input.value && i<otpInputs.length-1) otpInputs[i+1].focus();});
    input.addEventListener('keydown',e=>{if(e.key==='Backspace' && !input.value && i>0) otpInputs[i-1].focus();});
});

function startResendTimer(){
    document.getElementById('resendBtn').disabled=true;
    totalSeconds=60; document.getElementById('resendTimer').innerText=totalSeconds;
    resendInterval=setInterval(()=>{
        totalSeconds--; document.getElementById('resendTimer').innerText=totalSeconds;
        if(totalSeconds<=0){ clearInterval(resendInterval); document.getElementById('resendBtn').disabled=false; document.getElementById('resendBtn').innerText='Resend OTP'; }
    },1000);
}
startResendTimer();

document.getElementById('verifyBtn').addEventListener('click',async ()=>{
    const otp=otpInputs.map(i=>i.value).join(''); if(otp.length!==6){ showResponse('Enter 6-digit OTP'); return; }
    try{
        const confirmationResult=JSON.parse(window.localStorage.getItem('confirmationResult'));
        await confirmationResult.confirm(otp);
        const idToken=await firebase.auth().currentUser.getIdToken(true);
        const res=await fetch('/api/firebase-verify',{method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({idToken})});
        const data=await res.json();
        if(data.success){ showResponse('OTP verified!', 'green'); setTimeout(()=>window.location.href=data.redirect || '/reset-password',1500); }
        else showResponse(data.message);
    }catch(e){ showResponse('Invalid OTP'); }
});

document.getElementById('resendBtn').addEventListener('click',async ()=>{
    const phone=sessionStorage.getItem('resetPhone'); if(!phone){ showResponse('Session expired'); return; }
    try{
        window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'invisible'});
        const result=await firebase.auth().signInWithPhoneNumber('+91'+phone, window.recaptchaVerifier);
        window.localStorage.setItem('confirmationResult', JSON.stringify(result));
        showResponse('OTP resent', 'green'); startResendTimer();
        otpInputs.forEach(i=>i.value=''); otpInputs[0].focus();
    }catch(e){ showResponse('Failed to resend OTP'); }
});

function showResponse(msg,color='red'){ const div=document.getElementById('response'); div.style.color=color; div.innerText=msg;}
</script>
</body>
</html>
